name: Mac recovery diagnostics (isolated branch)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the test bundle before adding load
        run: swift build --package-path macos --build-tests
      - name: Reproduce the fractional uptime boundary
        run: swift test --skip-build --package-path macos --filter testFractionalUptimeReachesTheRecoveryDeadline
