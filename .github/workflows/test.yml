name: Mac recovery diagnostics (isolated branch)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the test bundle before adding load
        run: swift build --package-path macos --build-tests
      - name: Capture the first recovery failure under bounded CPU load
        shell: bash
        run: |
          yes > /dev/null &
          load1=$!
          yes > /dev/null &
          load2=$!
          trap 'kill "$load1" "$load2" 2>/dev/null || true; wait "$load1" "$load2" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 12); do
            echo "::group::Recovery diagnostic attempt $attempt"
            swift test --skip-build --package-path macos --filter WorkerRecoveryTests
            echo "::endgroup::"
          done
