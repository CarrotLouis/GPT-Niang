name: Mac recovery diagnostics (isolated branch)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Repeat the unchanged recovery assertions and capture process state on failure
        shell: bash
        run: |
          failures=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "::group::Recovery attempt $attempt"
            if swift test --package-path macos --filter WorkerRecoveryTests; then
              echo "Recovery attempt $attempt passed"
            else
              failures=$((failures + 1))
              echo "Recovery attempt $attempt failed"
            fi
            echo "::endgroup::"
          done
          echo "Recovery attempts failed: $failures of 8"
          test "$failures" -eq 0
